<!-- Warm the connection to Adobe Edge Network so the Alloy analytics
     beacon + Target decision call don't pay DNS+TLS handshake cost.
     Applied globally because every EDS page calls Edge for analytics.
     Zero LHS impact — handshake doesn't compete with the LCP image. -->
<link rel="preconnect" href="https://edge.adobedc.net" crossorigin>
<link rel="dns-prefetch" href="https://edge.adobedc.net">

<!-- Page-scoped perf hint for the painting-contractors page: preload
     alloy.min.js at low priority so it's already in HTTP cache when
     initAnalytics runs in lazy phase. Saves ~300-500 ms on Target
     proposition arrival without competing with the LCP image
     (fetchpriority="low" queues behind it). Other pages don't pay
     the 150 KB speculative download cost. -->
<script>
  (function () {
    var p = window.location.pathname;
    var isContractorsPage = p.indexOf('/contractors/painting-contractors') === 0
      || p === '/contractors/painting-contractors.html';
    if (!isContractorsPage) return;

    var preload = document.createElement('link');
    preload.rel = 'preload';
    preload.as = 'script';
    preload.href = '/eds/scripts/vendor/alloy.min.js';
    preload.setAttribute('fetchpriority', 'low');
    document.head.appendChild(preload);
  }());
</script>
